name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Build solution
        shell: pwsh
        run: dotnet build .\TwinQuota.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Run unit tests
        shell: pwsh
        run: dotnet test .\tests\TwinQuota.Core.Tests\TwinQuota.Core.Tests.csproj --configuration Release --no-restore

  release:
    name: Package and Release
    runs-on: windows-latest
    needs: [build, test]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Extract project version
        id: project_version
        shell: pwsh
        run: |
          $rawVersion = (dotnet msbuild .\src\TwinQuota.Windows\TwinQuota.Windows.csproj -getProperty:Version).Trim()
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            $rawVersion = "0.1.0"
          }
          Write-Host "Resolved project version: $rawVersion"
          "version=$rawVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$rawVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package Windows app and build installer
        shell: pwsh
        run: .\scripts\publish.ps1 -BuildInstaller

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinQuota-Setup
          path: artifacts/win-x64/TwinQuota-Setup-v${{ steps.project_version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinQuota-win-x64
          path: artifacts/win-x64/TwinQuota-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.project_version.outputs.tag }}
          RELEASE_TITLE: TwinQuota ${{ steps.project_version.outputs.tag }}
          SETUP_EXE_PATH: artifacts/win-x64/TwinQuota-Setup-v${{ steps.project_version.outputs.version }}.exe
          ZIP_PATH: artifacts/win-x64/TwinQuota-win-x64.zip
        run: |
          Write-Host "Target release tag: $env:RELEASE_TAG"
          $releaseJson = $null
          try {
            $releaseJson = gh release view $env:RELEASE_TAG --json tagName 2>$null
          } catch {
            $releaseJson = $null
          }

          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            Write-Host "Release $env:RELEASE_TAG exists. Updating release assets..."
            gh release upload $env:RELEASE_TAG $env:SETUP_EXE_PATH $env:ZIP_PATH --clobber
          } else {
            Write-Host "Creating new GitHub Release $env:RELEASE_TAG..."
            gh release create $env:RELEASE_TAG $env:SETUP_EXE_PATH $env:ZIP_PATH --title "$env:RELEASE_TITLE" --generate-notes
          }



