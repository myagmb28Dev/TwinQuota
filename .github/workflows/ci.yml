name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Build solution
        shell: pwsh
        run: dotnet build .\TwinQuota.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Run unit tests
        shell: pwsh
        run: dotnet test .\tests\TwinQuota.Core.Tests\TwinQuota.Core.Tests.csproj --configuration Release --no-restore

  release:
    name: Package and Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: [build, test]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Extract project version
        id: project_version
        shell: pwsh
        run: |
          $baseVersion = (dotnet msbuild .\src\TwinQuota.Windows\TwinQuota.Windows.csproj -getProperty:Version).Trim()
          if ($baseVersion -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.\d+(?:[-+].*)?$') {
            throw "Project version '$baseVersion' is not a supported semantic version."
          }

          Write-Host "Resolved release version: $baseVersion"
          "version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check whether release already exists
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.project_version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            Write-Host "Release $env:RELEASE_TAG already exists; leaving it unchanged."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Release $env:RELEASE_TAG does not exist; it will be created."
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Package Windows app and build installer
        if: steps.release_state.outputs.should_release == 'true'
        shell: pwsh
        run: .\scripts\publish.ps1 -BuildInstaller -Version "${{ steps.project_version.outputs.version }}"

      - name: Upload Windows installer artifact
        if: steps.release_state.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TwinQuota-Setup
          path: artifacts/win-x64/TwinQuota-Setup-v${{ steps.project_version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: steps.release_state.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.project_version.outputs.tag }}
          RELEASE_TITLE: TwinQuota ${{ steps.project_version.outputs.tag }}
          SETUP_EXE_PATH: artifacts/win-x64/TwinQuota-Setup-v${{ steps.project_version.outputs.version }}.exe
        run: |
          Write-Host "Target release tag: $env:RELEASE_TAG"
          gh release create $env:RELEASE_TAG $env:SETUP_EXE_PATH --title "$env:RELEASE_TITLE" --generate-notes




