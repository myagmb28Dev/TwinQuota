name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Build solution
        shell: pwsh
        run: dotnet build .\TwinQuota.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Run unit tests
        shell: pwsh
        run: dotnet test .\tests\TwinQuota.Core.Tests\TwinQuota.Core.Tests.csproj --configuration Release --no-restore


