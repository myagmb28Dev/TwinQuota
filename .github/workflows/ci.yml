name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\TwinQuota.slnx -p:NuGetAudit=false

      - name: Build
        shell: pwsh
        run: dotnet build .\TwinQuota.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test .\tests\TwinQuota.Core.Tests\TwinQuota.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Package Windows app
        shell: pwsh
        run: .\scripts\publish.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TwinQuota-win-x64
          path: artifacts/win-x64/TwinQuota-win-x64.zip
          if-no-files-found: error
          retention-days: 14
